<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E9EDF1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Паола">
<title>Паола</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- Экран входа -->
<div id="login-screen" class="login-screen hidden">
  <form id="login-form" class="login-card">
    <div class="orb orb-lg" aria-hidden="true">П</div>
    <h1>Паола</h1>
    <p class="login-sub">персональный ассистент</p>
    <input type="password" id="login-password" placeholder="Пароль" autocomplete="current-password" required>
    <button type="submit">Войти</button>
    <p id="login-error" class="login-error hidden">Неверный пароль</p>
  </form>
</div>

<!-- Приложение -->
<div id="app" class="app hidden">

  <!-- ===== ГЛАВНАЯ ===== -->
  <section id="view-home" class="view">
    <div class="home-head">
      <div>
        <div id="home-meta" class="meta-label"></div>
        <h1 id="home-greeting" class="greeting">Доброе утро,<br>Юлия</h1>
      </div>
      <button id="logout-btn" class="ghost-btn" type="button">Выйти</button>
    </div>

    <div id="day-status-card" class="nudge hidden">
      <div class="nudge-head">
        <span class="orb orb-sm" aria-hidden="true">П</span>
        <span class="nudge-who">Паола · на связи</span>
      </div>
      <p id="day-status-text" class="nudge-text"></p>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>Сегодня</h2>
        <div class="cal-head-actions">
          <button id="cal-refresh" class="icon-btn" type="button" aria-label="Обновить календарь">↻</button>
          <div class="seg">
            <button class="seg-btn active" data-cal-scope="today" type="button">День</button>
            <button class="seg-btn" data-cal-scope="tomorrow" type="button">Завтра</button>
            <button class="seg-btn" data-cal-scope="week" type="button">Неделя</button>
          </div>
        </div>
      </div>
      <div id="calendar-body" class="soft-card">Загружаю…</div>
    </div>

    <div class="section">
      <div class="section-head">
        <h2>Задачи</h2>
        <div class="task-head-actions">
          <button id="new-task-btn" class="pill pill-ghost" type="button">＋ задача</button>
          <span id="tasks-meta" class="meta-label"></span>
        </div>
      </div>
      <div id="tasks-body">Загружаю…</div>
    </div>

    <div class="section">
      <div class="section-head"><h2>Привычки</h2><span id="habits-date" class="meta-label"></span></div>
      <ul id="habits-list" class="habits"></ul>
      <p id="habits-empty" class="empty hidden"></p>
    </div>

    <div class="section">
      <div class="section-head"><h2>Напоминания</h2></div>
      <ul id="reminders-list" class="reminders"></ul>
      <p id="reminders-empty" class="empty hidden"></p>
      <form id="reminder-form" class="reminder-form">
        <input type="text" id="reminder-text" placeholder="О чём напомнить" required>
        <input type="datetime-local" id="reminder-when" required>
        <button type="submit" class="pill pill-solid">Создать</button>
      </form>
    </div>
  </section>

  <!-- ===== НЕДЕЛЯ (итоги / план) ===== -->
  <section id="view-analytics" class="view hidden">
    <div class="section-head view-title"><h2>Неделя</h2></div>
    <div class="seg seg-wide">
      <button class="seg-btn active" data-analytics-mode="review" type="button">Итоги недели</button>
      <button class="seg-btn" data-analytics-mode="plan" type="button">План недели</button>
    </div>

    <div id="analytics-review">
      <div class="week-nav">
        <button id="week-prev" class="ghost-btn" type="button">◀</button>
        <span id="week-label" class="meta-label"></span>
        <button id="week-next" class="ghost-btn" type="button">▶</button>
      </div>
      <div id="analytics-body">Загружаю…</div>
    </div>

    <div id="analytics-plan" class="hidden">
      <div class="plan-label meta-label"></div>
      <div id="plan-body">Загружаю…</div>
    </div>
  </section>

  <!-- ===== НИЖНЯЯ НАВИГАЦИЯ ===== -->
  <nav class="tabbar" aria-label="Основная навигация">
    <button class="tab active" data-view="home" type="button"><span class="tab-ico">⌂</span>Дом</button>
    <button class="tab" data-view="analytics" type="button"><span class="tab-ico">◔</span>Неделя</button>
  </nav>
</div>

<!-- Диалог: перенос дедлайна задачи -->
<dialog id="dlg-resched">
  <form method="dialog" class="dlg-form" id="dlg-resched-form">
    <h3>Перенести дедлайн</h3>
    <p id="dlg-resched-title" class="dlg-resched-task"></p>
    <label>Новая дата
      <input type="date" id="dlg-resched-date" required>
    </label>
    <div class="dlg-actions">
      <button value="cancel" class="pill pill-ghost" formnovalidate>Отмена</button>
      <button value="ok" class="pill pill-solid">Перенести</button>
    </div>
  </form>
</dialog>

<!-- Диалог: новая задача -->
<dialog id="dlg-task">
  <form method="dialog" class="dlg-form" id="dlg-task-form">
    <h3>Новая задача</h3>
    <label>Задача
      <div class="task-input-row">
        <input type="text" id="dlg-task-title" placeholder="Что нужно сделать" required>
        <button type="button" id="task-mic-btn" class="mic-btn hidden" aria-label="Голосовой ввод" title="Наговорить">🎙</button>
      </div>
    </label>
    <label>Зона
      <select id="dlg-task-zone">
        <option value="💼 Бизнес" selected>💼 Бизнес</option>
        <option value="👥 Networking">👥 Networking</option>
        <option value="💰 Финансы">💰 Финансы</option>
        <option value="🏥 Salute">🏥 Salute</option>
        <option value="🧠 Mental">🧠 Mental</option>
        <option value="🏠 Family">🏠 Family</option>
        <option value="💅 Beauty">💅 Beauty</option>
        <option value="✈️ Viaggi">✈️ Viaggi</option>
        <option value="🪞 Personal">🪞 Personal</option>
      </select>
    </label>
    <label>Приоритет
      <div class="seg seg-wide" id="dlg-task-priority">
        <button type="button" class="seg-btn" data-priority="❗ Важное">Важное</button>
        <button type="button" class="seg-btn active" data-priority="✅ Обычное">Обычное</button>
        <button type="button" class="seg-btn" data-priority="🔜 Когда-нибудь">Когда-нибудь</button>
      </div>
    </label>
    <label>Дедлайн
      <input type="date" id="dlg-task-date">
      <div class="task-date-quick">
        <button type="button" class="pill pill-ghost pill-sm" data-quick-date="today">Сегодня</button>
        <button type="button" class="pill pill-ghost pill-sm" data-quick-date="tomorrow">Завтра</button>
        <button type="button" class="pill pill-ghost pill-sm active" data-quick-date="none">Без даты</button>
      </div>
    </label>
    <details class="dlg-comment">
      <summary>Комментарий</summary>
      <textarea id="dlg-task-comment" rows="2" placeholder="Необязательно"></textarea>
    </details>
    <div class="dlg-actions">
      <button value="cancel" class="pill pill-ghost" formnovalidate>Отмена</button>
      <button value="ok" class="pill pill-solid">Создать</button>
    </div>
  </form>
</dialog>

<script src="/static/app.js"></script>
</body>
</html>
